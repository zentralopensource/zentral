---
name: Tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  run_tests:
    runs-on: ubuntu-latest
    env:
      # the name of the image that docker compose uses for the web service
      COMPOSE_PROJECT_NAME: zentral
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      # docker compose uses this image, and does not build it again.
      # Only main writes the cache: the caches of the repository share one size limit.
      - name: build the web image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: ${{ env.COMPOSE_PROJECT_NAME }}-web
          cache-from: type=gha,scope=tests
          cache-to: ${{ github.event_name == 'push' && 'type=gha,scope=tests,mode=max' || '' }}

      - name: run tests with coverage
        run: docker compose -f docker-compose.yml -f docker-compose.tests.yml run --quiet-pull --quiet-build -u root web tests_with_coverage
        env:
          COMPOSE_DOCKER_CLI_BUILD: 1
          DOCKER_BUILDKIT: 1

      - name: combine the coverage data files
        run: docker compose run --quiet-pull --quiet-build -u root web coverage_combine
        env:
          COMPOSE_DOCKER_CLI_BUILD: 1
          DOCKER_BUILDKIT: 1

      - name: output coverage lcov
        run: docker compose run --quiet-pull --quiet-build -u root web coverage_lcov
        env:
          COMPOSE_DOCKER_CLI_BUILD: 1
          DOCKER_BUILDKIT: 1

      - name: Coveralls
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        continue-on-error: true
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path-to-lcov: "./coverage.lcov"

      # after the tests, so that a warning does not hide their results
      - name: lint
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: docker compose run --rm --quiet-pull --no-deps web flake8
