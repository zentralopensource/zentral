---
name: Docker

# Builds the images to check that they build. Nothing is pushed.
# Only these files change the result of the build: the Dockerfile copies the code, and does not run it.

on:
  push:
    branches:
      - 'main'
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'requirements*.txt'
      - 'package.json'
      - 'package-lock.json'
      - 'webpack.config.js'
      - 'server/static_src/**'
      - '.github/workflows/docker.yml'
  pull_request:
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'requirements*.txt'
      - 'package.json'
      - 'package-lock.json'
      - 'webpack.config.js'
      - 'server/static_src/**'
      - '.github/workflows/docker.yml'
  # the base images and the package indexes change without a commit
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker:
    strategy:
      fail-fast: false
      matrix:
        app_env: ["dev", "aws", "gcp"]
        runner: ["ubuntu-24.04", "ubuntu-24.04-arm"]
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      # One cache scope for each image, because a build replaces the index of its scope.
      # Only main writes the cache: the caches of the repository share one size limit.
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          outputs: type=cacheonly
          cache-from: type=gha,scope=${{ matrix.app_env }}-${{ runner.arch }}
          cache-to: ${{ github.event_name != 'pull_request' && format('type=gha,scope={0}-{1},mode=max', matrix.app_env, runner.arch) || '' }}
          build-args: |
            APP_ENV=${{ matrix.app_env }}
