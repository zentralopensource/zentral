---
name: Install zentral-manifest
description: >-
  Copy the pinned zentral-manifest wheel from an artifacts bucket, check it
  against the pinned sha256, install the file, and import it. Needs AWS
  credentials that read zentral-manifest/ in that bucket.

inputs:
  bucket:
    description: The artifacts bucket to copy the wheel from
    required: true

runs:
  using: composite
  steps:
    - name: Copy, check, install and import the pinned wheel
      shell: bash
      env:
        # The pin. A new version is a new pair, written by hand: the version,
        # and the sha256 its sidecar gives under archive. See Installing in
        # the zentral-manifest README.
        VERSION: "2026.6"
        SHA256: "49d8a76e726e34dc086a86e7d5a3864ae076dfa955a715fb13941e3c421058f3"
        BUCKET: ${{ inputs.bucket }}
      run: |
        set -euo pipefail
        if ! [[ "$SHA256" =~ ^[0-9a-f]{64}$ ]]; then
          echo "::error::the zentral-manifest pin has no sha256"
          exit 1
        fi
        WHEEL="zentral_manifest-$VERSION-py3-none-any.whl"
        DEST="$RUNNER_TEMP/zentral-manifest"
        mkdir -p "$DEST"
        aws s3 cp "s3://$BUCKET/zentral-manifest/$WHEEL" "$DEST/$WHEEL" --no-progress
        echo "$SHA256  $DEST/$WHEEL" | sha256sum -c -
        pip3 install "$DEST/$WHEEL"
        # In the same step, so the version it is checked against is the pin above.
        python3 - <<'PY'
        import os, sys
        from importlib.metadata import version

        import zentral_manifest

        installed = version("zentral-manifest")
        print(f"zentral_manifest {installed} from {zentral_manifest.__file__}")
        if installed != os.environ["VERSION"]:
            sys.exit(f"installed {installed}, pinned {os.environ['VERSION']}")
        PY
