{% extends 'base.html' %}

{% block content %}
<ol class="breadcrumb">
  <li class="breadcrumb-item"><a href="/">Home</a></li>
  <li class="breadcrumb-item"><a href="{% url 'santa:index' %}">Santa</a></li>
  <li class="breadcrumb-item"><a href="{% url 'santa:configuration_list' %}">Configurations</a></li>
  <li class="breadcrumb-item"><a href="{{ object.configuration.get_absolute_url }}">{{ object.configuration }}</a></li>
  <li class="breadcrumb-item"><a href="{% url 'santa:configuration_scoped_path_regexes' object.configuration.pk %}">Scoped path regexes</a></li>
  <li class="breadcrumb-item active">Delete scoped path regex</li>
</ol>

<h2>Delete scoped path regex</h2>

<form method="POST">{% csrf_token %}
  <p>Do you really want to delete this scoped path regex?</p>
  <p>
    <a class="btn btn-outline-secondary" href="{{ object.get_absolute_url }}">Cancel</a>
    <button class="btn btn-danger" type="submit">Delete</button>
  </p>
</form>
{% endblock %}
