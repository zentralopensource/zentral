{% extends 'base.html' %}

{% block content %}
<ol class="breadcrumb">
  <li class="breadcrumb-item"><a href="/">Home</a></li>
  <li class="breadcrumb-item active">Munki</li>
</ol>

<div class="row">
  <div class="col-md-12">
    <h2>Munki</h2>
  </div>
  <div class="col-sm-6">
    <canvas class="chart"
            data-app="munki"
            data-dataset="event_count"
            width="200"
            height="120"></canvas>
  </div>
  <div class="col-sm-6">
    <canvas class="chart"
            data-app="munki"
            data-dataset="unique_msn"
            width="200"
            height="120"></canvas>
  </div>
  <div class="col-md-12">
    {% if perms.munki.view_configuration %}
    <p><a href="{% url 'munki:configurations' %}">Configurations</a></p>
    {% endif %}
    {% if perms.munki.view_scriptcheck %}
    <p><a href="{% url 'munki:script_checks' %}">Script checks</a></p>
    {% endif %}
  </div>
</div>
{% endblock %}
